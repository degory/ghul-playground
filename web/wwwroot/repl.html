<!DOCTYPE html>
<html>

<head>
  <title>ghūl REPL</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="favicon.ico" sizes="16x16 32x32">
  <link rel="icon" type="image/png" href="ghul-logo-128.png" sizes="128x128">
  <link rel="preload" id="webassembly" />
  <script type="importmap"></script>
  <style>
    @font-face {
      font-family: 'Fira Code';
      font-style: normal;
      font-weight: 300 700;
      font-display: swap;
      src: url('https://cdn.jsdelivr.net/npm/firacode@6.2.0/distr/woff2/FiraCode-VF.woff2') format('woff2');
    }
  </style>
  <link rel="stylesheet" href="vs/editor/editor.main.css">
  <script src="vs/loader.js"></script>
  <script type='module' src="repl#[.{fingerprint}].js"></script>
  <style>
    /* The playground page's palette, so the two read as one site. */
    :root {
      color-scheme: light dark;

      --bg: #ffffff;
      --bg-raised: #f6f7f9;
      --fg: #1f2328;
      --fg-muted: #656d76;
      --border: #d8dde3;
      --accent: #0969da;
      --ok: #1a7f37;
      --warn: #9a6700;
      --bad: #cf222e;
      --mono: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1e1e1e;
        --bg-raised: #252526;
        --fg: #e6edf3;
        --fg-muted: #9198a1;
        --border: #3c3c3c;
        --accent: #4daafc;
        --ok: #3fb950;
        --warn: #d29922;
        --bad: #f85149;
      }
    }

    * { box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--fg);
    }

    header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 0.6rem;
      border-bottom: 1px solid var(--border);
      background: var(--bg-raised);
      flex: none;
    }

    header .title { font-weight: 600; }

    header .nav { margin-right: auto; color: var(--accent); font-size: 0.8125rem; text-decoration: none; }
    header .nav:hover { text-decoration: underline; }

    #status { color: var(--fg-muted); font-size: 0.8125rem; }

    button {
      font: inherit;
      font-size: 0.8125rem;
      height: 1.75rem;
      padding: 0 0.6rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--fg);
      cursor: pointer;
    }

    button:hover:not(:disabled) { background: color-mix(in srgb, var(--fg) 8%, transparent); }
    button:disabled { cursor: default; opacity: 0.45; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

    main {
      flex: 1;
      overflow-y: auto;
      padding: 0.75rem 1rem 1rem;
    }

    .entry { margin-bottom: 0.9rem; }

    .entry .input {
      display: grid;
      grid-template-columns: 3.5rem 1fr;
      font-family: var(--mono);
      white-space: pre;
      overflow-x: auto;
    }

    .prompt { color: var(--fg-muted); font-family: var(--mono); user-select: none; }

    .entry .result {
      margin-left: 3.5rem;
      font-family: var(--mono);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .result .value { color: var(--accent); }
    .result .diagnostic { color: var(--bad); }
    .result .diagnostic.warn, .result .note { color: var(--warn); }
    .result .error { color: var(--bad); }
    .result .muted { color: var(--fg-muted); font-style: italic; }

    #input-row {
      display: grid;
      grid-template-columns: 3.5rem 1fr;
      align-items: start;
    }

    #input { min-height: 1.5rem; border-left: 2px solid var(--accent); }

    #help { margin: 0.4rem 0 0 3.5rem; color: var(--fg-muted); font-size: 0.8125rem; }

    #unavailable { padding: 2rem 1rem; color: var(--fg-muted); }
  </style>
</head>

<body>
  <header>
    <span class="title">ghūl REPL</span>
    <!-- Relative to the base, which is the playground's directory wherever
         this page is served from. -->
    <a class="nav" href="./" title="The playground: write and run a whole program">playground</a>
    <span id="status" aria-live="polite"></span>
    <button id="stop" disabled title="Stop the running cell. The session goes with it.">Stop</button>
    <button id="reset" title="Start a new session">New session</button>
  </header>

  <main id="transcript">
    <div id="input-row" hidden>
      <span class="prompt" id="prompt"></span>
      <div id="input"></div>
    </div>
    <p id="help" hidden>
      Ctrl-, Shift- or Alt-Enter runs the cell; so does a line holding only a dot.
      Enter on its own starts a new line.
    </p>
    <p id="unavailable" hidden></p>
  </main>
</body>

</html>
