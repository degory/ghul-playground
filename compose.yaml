# The three services, with the limits that actually contain the compiler.
#
# The build context is the repository root for compile and analyse, because they
# share the reference-set resolution in shared/. goatcounter shares nothing with
# either and builds from its own directory.
#
# Egress is the one control this file cannot express. Docker gives a container
# either a network or none, and every service needs ingress, so they get both.
# Block outbound traffic at the host firewall or put them on an internal network
# behind the reverse proxy.
#
# compile and analyse are stateless and can be thrown away at any point.
# goatcounter is not: its volume is the only thing on this host that cannot be
# rebuilt from this repository. See "analytics" in deploy/README.md.

x-hardening: &hardening
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# Pinned, because the host firewall rule that denies these containers egress
# matches on this subnet. Left to Docker it is assigned at creation and can
# change when the network is recreated, silently orphaning the rule and
# restoring the egress it was there to remove.
networks:
  default:
    ipam:
      config:
        - subnet: 172.31.240.0/24

services:
  compile:
    <<: *hardening
    build:
      context: .
      dockerfile: compile-service/Dockerfile
    image: ghul-playground-compile

    environment:
      # A short fixed list of shared access tokens, comma separated. Supplied
      # from the environment, never committed. Empty leaves the services open,
      # which is the current posture; the load is bounded by the caps below and
      # the nginx per-address limits instead. Both services must agree.
      PLAYGROUND_TOKENS: "${PLAYGROUND_TOKENS:-}"
      # Which sites may drive the service from a browser. Unset means any, which
      # is what local development wants. Both services must agree here too.
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-}"
      # A compile is about a CPU-second and peaks near 200 MB, so this rather
      # than mem_limit is what keeps the container off its cap. Past the queue
      # the service answers 503 rather than accepting work it cannot do.
      MAX_CONCURRENT_COMPILES: "2"
      MAX_QUEUED_COMPILES: "6"
      COMPILE_TIMEOUT_MS: "10000"

    # Bound to loopback: these sit behind a reverse proxy that terminates TLS,
    # rather than facing the internet themselves.
    ports:
      - "127.0.0.1:5090:5090"

    # The compiler writes its output next to the source it was given.
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m

    # A compile of a single file peaks under 200 MB measured; the cap is here so
    # a runaway allocation fails rather than taking the host down.
    mem_limit: 512m
    memswap_limit: 512m
    # Docker refuses a value above the host's CPU count, so this has to fit the
    # smallest machine deployed to. Raise it where there is more to give.
    cpus: 2.0
    pids_limit: 256

  analyse:
    <<: *hardening
    build:
      context: .
      dockerfile: analyse-service/Dockerfile
    image: ghul-playground-analyse

    ports:
      - "127.0.0.1:5091:5091"

    environment:
      PLAYGROUND_TOKENS: "${PLAYGROUND_TOKENS:-}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-}"
      # Measured against the trimmed reference set and a single file, an
      # analyser costs around 70 MB rather than the 260 MB a full project
      # needs. The worst case is MAX_SESSIONS + POOL_SIZE of them, since the
      # pool tops up alongside the sessions in use rather than instead of them.
      MAX_SESSIONS: "6"
      POOL_SIZE: "3"
      IDLE_TIMEOUT_MS: "300000"
      MAX_SESSION_MS: "3600000"

    # Each session gets its own workspace directory here, and the analyser
    # writes the document to it.
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m

    mem_limit: 1g
    memswap_limit: 1g
    cpus: 2.0
    pids_limit: 512

  goatcounter:
    <<: *hardening
    build:
      context: goatcounter
      dockerfile: Dockerfile
    image: ghul-playground-goatcounter

    ports:
      - "127.0.0.1:5092:5092"

    # The named volume, not a tmpfs: this is the one service whose data has to
    # survive the container. read_only above still holds for the rest of the
    # filesystem - the volume is the only writable path, which is what we want.
    volumes:
      - goatcounter-data:/home/goatcounter/goatcounter-data

    # CSV exports are written to TMPDIR. Small, and nothing else needs scratch
    # space, so this is well clear of what it will ever hold.
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m

    # An order of magnitude below the other two. It serves a dashboard and
    # appends rows; the work is neither CPU- nor memory-shaped, and on SQLite
    # at this site's volume it sits near idle. The cap is here so that a runaway
    # cannot take the compile service down with it.
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    pids_limit: 128

# Analytics history. Nothing else on this host is stateful, and this is
# deliberately a named volume rather than a bind mount so that a stray
# `docker compose down -v` is the only way to lose it by accident.
volumes:
  goatcounter-data:
