# Both services, with the limits that actually contain the compiler.
#
# The build context is the repository root for both, because they share the
# reference-set resolution in shared/.
#
# Egress is the one control this file cannot express. Docker gives a container
# either a network or none, and both services need ingress, so they get both.
# Block outbound traffic at the host firewall or put them on an internal network
# behind the reverse proxy.

x-hardening: &hardening
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# Pinned, because the host firewall rule that denies these containers egress
# matches on this subnet. Left to Docker it is assigned at creation and can
# change when the network is recreated, silently orphaning the rule and
# restoring the egress it was there to remove.
networks:
  default:
    ipam:
      config:
        - subnet: 172.31.240.0/24

services:
  compile:
    <<: *hardening
    build:
      context: .
      dockerfile: compile-service/Dockerfile
    image: ghul-playground-compile

    environment:
      # A short fixed list of shared access tokens, comma separated. Supplied
      # from the environment, never committed. Both services must agree.
      PLAYGROUND_TOKENS: "${PLAYGROUND_TOKENS:-}"

    # Bound to loopback: these sit behind a reverse proxy that terminates TLS,
    # rather than facing the internet themselves.
    ports:
      - "127.0.0.1:5090:5090"

    # The compiler writes its output next to the source it was given.
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m

    # A compile of a single file peaks under 200 MB measured; the cap is here so
    # a runaway allocation fails rather than taking the host down.
    mem_limit: 512m
    memswap_limit: 512m
    # Docker refuses a value above the host's CPU count, so this has to fit the
    # smallest machine deployed to. Raise it where there is more to give.
    cpus: 2.0
    pids_limit: 256

  analyse:
    <<: *hardening
    build:
      context: .
      dockerfile: analyse-service/Dockerfile
    image: ghul-playground-analyse

    ports:
      - "127.0.0.1:5091:5091"

    environment:
      PLAYGROUND_TOKENS: "${PLAYGROUND_TOKENS:-}"
      # Measured against the trimmed reference set and a single file, an
      # analyser costs around 70 MB rather than the 260 MB a full project
      # needs. The worst case is MAX_SESSIONS + POOL_SIZE of them, since the
      # pool tops up alongside the sessions in use rather than instead of them.
      MAX_SESSIONS: "6"
      POOL_SIZE: "3"
      IDLE_TIMEOUT_MS: "300000"
      MAX_SESSION_MS: "3600000"

    # Each session gets its own workspace directory here, and the analyser
    # writes the document to it.
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m

    mem_limit: 1g
    memswap_limit: 1g
    cpus: 2.0
    pids_limit: 512
