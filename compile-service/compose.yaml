# Run limits for the compile service. These, not the Dockerfile, are what
# actually contain the compiler.
#
# Egress is the one control this file cannot express. Docker gives a container
# either a network or none, and the service needs ingress, so it gets both.
# Block outbound traffic at the host firewall or put the container on an
# internal network behind a reverse proxy. Without that a compiler bug reachable
# from user source could still talk to the outside world.

services:
  compile:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghul-playground-compile

    # Bound to loopback: this is meant to sit behind a reverse proxy that
    # terminates TLS, not to face the internet itself.
    ports:
      - "127.0.0.1:5090:5090"

    read_only: true

    # The compiler writes its output next to the source it was given, so it
    # needs somewhere writable. Small, and gone when the container stops.
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m

    # The compiler needs none of these. Dropping them costs nothing and
    # removes most of what a container escape would reach for.
    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    # A single compile of a single file peaks well under this; the cap is
    # here to make a runaway allocation fail rather than take the host down.
    mem_limit: 1g
    memswap_limit: 1g
    # Docker refuses a value above the host's CPU count, so this has to fit the
    # smallest machine the service is deployed to. Raise it where there is more
    # to give.
    cpus: 1.0
    pids_limit: 256

    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
