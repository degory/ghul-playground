# Both datasources are provisioned rather than added by hand, so what a
# dashboard reads is in this repository rather than in the container's own
# database.

apiVersion: 1

datasources:
  # The analytics snapshot: a copy of GoatCounter's database, taken every few
  # minutes and mounted read-only. Grafana can neither reach the live file nor
  # write this one - see deploy/snapshot/snapshot.sh for why both matter.
  - name: Analytics
    uid: analytics
    type: frser-sqlite-datasource
    access: proxy
    isDefault: true
    jsonData:
      path: /snapshot/analytics.sqlite3
    editable: false

  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    editable: false
