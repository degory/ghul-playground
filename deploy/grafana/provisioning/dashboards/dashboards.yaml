# Dashboards come from files in this repository, not from someone clicking them
# together: a dashboard nobody can review is one nobody can fix.

apiVersion: 1

providers:
  - name: ghul
    type: file
    updateIntervalSeconds: 30
    # Read-only in the interface. A change made there would be lost at the next
    # deploy, which is worse than not being able to make it.
    allowUiUpdates: false
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
