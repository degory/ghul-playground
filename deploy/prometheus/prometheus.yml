# What this host is doing, as against what its visitors are doing. Visitor
# analytics are not here and cannot be: Prometheus stores pre-aggregated series
# and has no way to show one visit's sequence, which is the question the
# analytics side exists to answer.

global:
  # Thirty seconds rather than fifteen. Nothing here changes faster than that
  # matters for, and the series count is what decides both the memory and the
  # disk, so halving the rate halves both for no loss.
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # The machine: processor, load, memory, disk, network.
  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']

  # Per-container processor and memory, which is the half that matters here:
  # the compile service has been OOM-killed before, and a cap it is sitting
  # against is invisible from the host's own numbers.
  - job_name: containers
    static_configs:
      - targets: ['cadvisor:8080']

    metric_relabel_configs:
      # cAdvisor reports each container under its cgroup path, which for Docker
      # is `/system.slice/docker-<id>.scope`. Without a name from Docker's own
      # API the id is what there is, so it is lifted into a label of its own and
      # shortened to the twelve characters `docker ps` prints.
      - source_labels: [id]
        regex: '.*docker[-/]([0-9a-f]{12})[0-9a-f]*(\.scope)?'
        target_label: container
        replacement: '$1'

      # Everything else cAdvisor reports is a cgroup of the machine's own - the
      # root, the system slice, one per service - and there are sixty of them to
      # every container. The machine's own numbers come from node-exporter,
      # which measures them properly, so these are dropped rather than stored:
      # they are most of the series this job would otherwise cost.
      - source_labels: [container]
        regex: '^$'
        action: drop
