# Reverse proxy for a deployed playground.
#
# Copy to /etc/nginx/sites-available/, symlink into sites-enabled/, and edit the
# server name. Install playground-limits.conf into conf.d/ at the same time: the
# rate and connection zones this file uses are defined there. Certbot fills in
# the certificate paths when it first issues.

# Port 80 exists for two things: sending real traffic to HTTPS, and letting
# Let's Encrypt validate. The challenge path is served here rather than being
# redirected, so renewal does not depend on anything in the HTTPS server below.
server {
    listen 80;
    listen [::]:80;
    server_name playground.ghul.dev;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name playground.ghul.dev;

    ssl_certificate /etc/letsencrypt/live/playground.ghul.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/playground.ghul.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # There is no address allow list, and there cannot be: the point of the
    # embed is to be reached from a documentation site whose readers are
    # anywhere. What bounds the load instead is the per-address limits below,
    # and, in the services, a cap on simultaneous compiles and on sessions.
    #
    # Note what is deliberately NOT restricted: /health answers unauthenticated
    # and to any origin, because an embedding page has to be able to ask whether
    # a back end exists before it knows it is welcome to one.

    root /var/www/playground;
    index index.html;

    # The embedded playground is framed by the documentation site. Everything
    # else is refused, so the page cannot be framed to impersonate a site.
    add_header Content-Security-Policy "frame-ancestors 'self' https://ghul.dev https://www.ghul.dev" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Both the .NET runtime and Monaco publish precompressed copies.
    gzip_static on;

    # The .NET publish pipeline fingerprints these, so the name changes
    # whenever the content does and they can be cached indefinitely.
    location ^~ /_framework/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Everything else keeps a stable name across deploys - main.js and lsp.js
    # deliberately are not fingerprinted, because fingerprinting them also
    # renames Monaco's files and breaks its loader. So they must be
    # revalidated rather than cached, or a deploy leaves browsers running the
    # previous front end against the new back end.
    location ~* \.(html|js|css|json)$ {
        add_header Cache-Control "no-cache" always;
    }

    # The entry page is requested as "/", which the extension match above
    # does not see, so it needs saying separately or the one document that
    # pulls in everything else is the one that goes stale.
    location = / {
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    location = /compile {
        # Zones defined in conf.d/playground-limits.conf, which must be
        # installed alongside this file.
        limit_req zone=playground_compile burst=15 nodelay;

        proxy_pass http://127.0.0.1:5090/compile;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        client_max_body_size 512k;
    }

    # An analyser session is a long-lived WebSocket that is idle whenever the
    # user is thinking, so the read timeout has to outlast that; the service
    # does its own idle reaping.
    location = /analyse {
        limit_conn playground_analyse 2;

        proxy_pass http://127.0.0.1:5091/analyse;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:5091/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
