# Refuse anything that does not ask for a hostname we serve.
#
# Copy to /etc/nginx/conf.d/, alongside playground-limits.conf.
#
# Without a default server, nginx answers every request whatever Host it
# carries, so the playground is served on the bare IP address as well as its
# name. Scanners find it that way: an address scan rendered the page and left a
# `Referer: https://<the IP>/` in the access log.
#
# This is not about hiding the content, which is public either way. It is that
# traffic addressed to the IP rather than the name is never a reader, and there
# is no reason to serve it, log it, or let it spend from the per-address limits
# that real readers share.

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    server_name _;

    # No certificate here: the handshake is refused before one is needed. That
    # is also the more honest answer than presenting a certificate for a name
    # the client never asked for. Clients that send no SNI at all are refused
    # too, which in practice means scanners rather than browsers.
    ssl_reject_handshake on;

    # 444 closes the connection with no response at all, so nothing is spent on
    # a reply and a scanner learns nothing from one.
    return 444;
}
