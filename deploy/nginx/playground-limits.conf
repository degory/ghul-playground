# Per-address limits for the playground back ends.
#
# Copy to /etc/nginx/conf.d/. It has to live there rather than in the site file
# next to it, because limit_req_zone and limit_conn_zone are only valid in the
# http context, and a file in sites-enabled is included inside a server block.
#
# These bound one address, which is all nginx can see. They are the cheap half
# of the answer: the services impose the limits that hold whatever the traffic
# is spread across, a cap on simultaneous compiles and a cap on sessions.

# A compile costs about a CPU-second, so a sustained one every two seconds from
# a single address is already generous for someone editing and re-running. The
# burst absorbs the impatient clicking that a real reader does.
limit_req_zone $binary_remote_addr zone=playground_compile:1m rate=30r/m;

# There are only six analyser sessions in total, so no single address may hold
# more than a third of them.
limit_conn_zone $binary_remote_addr zone=playground_analyse:1m;

# 429 rather than nginx's default 503: this is the client being asked to slow
# down, not the service failing.
limit_req_status 429;
limit_conn_status 429;
