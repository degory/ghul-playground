# Per-address limits for the playground back ends.
#
# Copy to /etc/nginx/conf.d/. It has to live there rather than in the site file
# next to it, because limit_req_zone and limit_conn_zone are only valid in the
# http context, and a file in sites-enabled is included inside a server block.
#
# These bound one address, which is all nginx can see. They are the cheap half
# of the answer: the services impose the limits that hold whatever the traffic
# is spread across, a cap on simultaneous compiles and a cap on sessions.

# A compile costs about a CPU-second, so a sustained one every two seconds from
# a single address is already generous for someone editing and re-running. The
# burst absorbs the impatient clicking that a real reader does.
limit_req_zone $binary_remote_addr zone=playground_compile:1m rate=30r/m;

# There are only six analyser sessions in total, so no single address may hold
# more than a third of them.
limit_conn_zone $binary_remote_addr zone=playground_analyse:1m;

# 429 rather than nginx's default 503: this is the client being asked to slow
# down, not the service failing.
limit_req_status 429;
limit_conn_status 429;

# Whose pageviews not to record. $count_excluded is 1 for an address whose
# visits should not reach the analytics.
#
# The ranges themselves are not in this repository: an exclusion list describes
# whoever is running the site rather than the site. They live in
# /etc/nginx/analytics-exclude.conf on the host, written by hand like the
# certificate and .env are; analytics-exclude.conf.example alongside this file
# is the template and carries the guidance on choosing one.
#
# Two details in that one include line, both of which bite if changed:
#
#   - The glob. A plain include of a missing file is fatal, so a host that has
#     not been given an exclusion list would refuse to start nginx. A glob
#     matching nothing is not an error, so the list is genuinely optional and a
#     fresh host records everything rather than serving nothing.
#   - The path. It is /etc/nginx and NOT /etc/nginx/conf.d, because nginx.conf
#     already pulls conf.d/*.conf into the http context - a file of bare
#     "1.2.3.0/24 1;" lines would be read there too, where it is a syntax error.
#
# This is the half that works regardless of the reader's browser. The other half
# is GoatCounter's own #toggle-goatcounter flag, which is per-browser and per
# origin, and covers the addresses this one cannot see. Neither is sufficient
# alone.
geo $count_excluded {
    default 0;
    include /etc/nginx/analytics-exclude*.conf;
}

# Connection: upgrade only when the client actually asked for it. The /analyse
# block can hard-code "upgrade" because every request there is a WebSocket, but
# GoatCounter's dashboard opens one over a prefix that otherwise serves ordinary
# pages, and sending the header on a plain GET is wrong. This has to live here
# rather than beside that location, because map is only valid in http context.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
